name: Rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "SeptianVgSs"
          git config user.email "SeptianVgSs@users.noreply.github.com"
          git mv sample-marketplace-nft-agent.html index.html
          git commit -m "Rename sample-marketplace-nft-agent.html to index.html"
          git push
